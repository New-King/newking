# 自动部署流水线：push 到 main → 构建静态文件 → SSH 同步到 1Panel 服务器
# 原理：GitHub 云端跑一个"虚拟电脑"(ubuntu-latest)，
#       依次执行下面 5 个步骤，完成后自动销毁。
name: 自动部署

on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发按钮（测试用，不用 push 也能跑）

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 把仓库代码下载到虚拟电脑
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js（前端构建需要）
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # 缓存依赖，加速下次构建

      # 3. 按 package-lock.json 安装依赖
      - name: 安装依赖
        run: npm ci

      # 4. 打包：生成 dist/ 静态文件（就是你说的"打包"步骤）
      - name: 构建静态文件
        run: npm run build

      # 5. 用 SSH 私钥连接服务器，rsync 同步 dist/ 到网站目录
      #    --delete = 删除服务器上已不存在的旧文件（如 1Panel 默认的 404.html）
      #    secrets = GitHub 仓库里加密保存的配置，不会出现在代码里
      - name: 同步到服务器
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_TARGET }}/
