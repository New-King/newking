# 后端 Python 服务（1Panel 用"编排/Compose"部署此文件）
# 用法：把此文件内容复制到 1Panel → 容器 → 编排 → 新建，或用 SSH 在服务器上 docker compose up -d
services:
  newking-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newking-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 数据库：1Panel 的 Postgres 映射在宿主机 127.0.0.1:5432
      # host.docker.internal = 宿主机（Linux 下需 extra_hosts）
      # 用户名/密码从 .env 读取（不硬编码进仓库）
      DATABASE_URL: postgresql://${POSTGRES_USER:-newking}:${POSTGRES_PASSWORD:-}@host.docker.internal:5432/${POSTGRES_DB:-newking_test}
      # 内容目录：容器内挂载的 content
      CONTENT_DIR: /app/content
      # --- 以下 key 请在 1Panel 编排里替换为真实值（或由 CI 注入） ---
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
      LANGSMITH_PROJECT: newking-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 把服务器上的 content 目录挂载进容器（CI 会把 content/ rsync 到这里）
      - /opt/newking/content:/app/content
