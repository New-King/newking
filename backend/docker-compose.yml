# 后端 Python 服务（1Panel 用"编排/Compose"部署此文件）
# 用法：把此文件内容复制到 1Panel → 容器 → 编排 → 新建，或用 SSH 在服务器上 docker compose up -d
services:
  newking-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newking-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 数据库：加入 1Panel 的 postgresql 网络，用容器名 postgresql 连
      # （1Panel Postgres 在 1panel-network，别名为 postgresql）
      DATABASE_URL: postgresql://${POSTGRES_USER:-newking}:${POSTGRES_PASSWORD:-}@postgresql:5432/${POSTGRES_DB:-newking_test}
      # 内容目录：容器内挂载的 content
      CONTENT_DIR: /app/content
      # --- 以下 key 从 .env 读取（.env 在 backend/ 目录，被 gitignore，不进仓库） ---
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
      LANGSMITH_PROJECT: newking-agent
    volumes:
      # 把服务器上的 content 目录挂载进容器（CI 会把 content/ rsync 到这里）
      - /opt/server/newking/content:/app/content
    networks:
      - 1panel-network

# 复用 1Panel 已存在的 docker 网络（Postgres 所在网络，容器名 postgresql）
networks:
  1panel-network:
    external: true
